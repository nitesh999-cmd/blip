<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Blip news</title>
  <link rel="stylesheet" href="news.css">
</head>
<body data-mode="rest">
  <section id="card" class="card" aria-live="polite">
    <header class="head">
      <span id="kind" class="kind">News</span>
      <button id="close" class="close" type="button" aria-label="Close">×</button>
    </header>
    <p id="note" class="note" hidden></p>
    <ol id="stories" class="stories"></ol>
  </section>
  <div id="dot" class="dot" role="button" aria-label="News dot">
    <span class="rays"></span>
    <span class="core"></span>
  </div>
  <script src="news.js"></script>
</body>
</html>
