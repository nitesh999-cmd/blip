<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>News topics</title>
  <link rel="stylesheet" href="news-settings.css">
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <header class="head">
      <h1 id="title">News topics</h1>
      <button id="dismiss" class="icon" type="button" aria-label="Close">×</button>
    </header>

    <p class="always"><span class="tick" aria-hidden="true">✓</span> Australian and world headlines, and the big winners. Always on.</p>

    <fieldset class="group">
      <legend>Also tell me about</legend>
      <div id="extras" class="extras"></div>
    </fieldset>

    <section class="group" aria-labelledby="mine">
      <h2 id="mine">Your own interests</h2>
      <p class="hint">Words to watch for in the news, like a team, a company or a suburb.</p>
      <form id="add" class="add">
        <input id="interest" type="text" maxlength="40" placeholder="e.g. Collingwood" autocomplete="off" aria-label="Add an interest">
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <ul id="interests" class="interests"></ul>
    </section>

    <footer class="foot">
      <button id="cancel" type="button" class="ghost">Cancel</button>
      <button id="save" type="button" class="primary">Save</button>
    </footer>
  </main>
  <script src="news-settings.js"></script>
</body>
</html>
